name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: macos-26
    env:
      # Deploy key with write access to the homebrew-tap repository only.
      TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Import signing certificate
        # A stable self-signed identity keeps the Accessibility grant across updates;
        # ad-hoc signatures change with every build.
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        if: ${{ env.CERT_P12 != '' }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw="$(openssl rand -hex 16)"
          printf '%s' "$CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # The certificate is not trusted, so codesign finds it only by its SHA-1.
          identity="$(security find-identity -p codesigning "$kc" | awk '/Clipvault Self-Signed/ {print $2; exit}')"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build universal app
        run: make dist VERSION=${{ github.ref_name }}
      - name: Check signature
        run: codesign -d -r- build/Clipvault.app
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" build/Clipvault-*.zip \
            --title "${{ github.ref_name }}" --generate-notes
      - name: Update Homebrew tap
        if: ${{ env.TAP_DEPLOY_KEY != '' }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha="$(shasum -a 256 "build/Clipvault-${version}.zip" | cut -d' ' -f1)"
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone "git@github.com:${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"${version}\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Casks/clipvault.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "clipvault ${version}"
          git push
